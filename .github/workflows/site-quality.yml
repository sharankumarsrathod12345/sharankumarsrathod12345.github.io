name: Portfolio quality checks
on:
  push:
    paths: ['**.html', 'assets/**', 'scripts/**', '.github/workflows/site-quality.yml']
  pull_request:
    paths: ['**.html', 'assets/**', 'scripts/**', '.github/workflows/site-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check assets/experience.js
      - run: python scripts/audit_site.py
